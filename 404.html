    <title>Fifa المملكة — Redirecting…</title>
    <script>
      // GitHub Pages URLs are case-sensitive. This page is served for ANY
      // unmatched path (e.g. /fc-records/ typed in lowercase), and sends the
      // visitor to the live app at the exact repo path.

        var target = 'https://awsaqh.github.io/Fc-records/';
        if (location.pathname.indexOf('/Fc-records') === 0) return;
        location.replace(target);
      })();
    </script>
